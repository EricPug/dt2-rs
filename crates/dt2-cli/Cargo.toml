[package]
name = "dt2-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dt2-core = { path = "../dt2-core" }
dt2-fw = { path = "../dt2-fw" }
minifb = { version = "0.29", optional = true }
image = { version = "0.25", default-features = false, features = ["webp"], optional = true }

[features]
window = ["dep:minifb", "dep:image"]
# Experimental execution tier: needs the patched Unicorn (UNICORN_LIB_DIR); see docs/coldfire-perf.md.
unicorn = []
